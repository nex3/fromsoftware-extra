[workspace]
resolver = "2"
members = [
    "crates/darksouls3",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/nex3/fromsoftware-extra"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
fromsoftware-shared = "0.12"
darksouls3 = "0.12"
thiserror = "1"
pelite = "0.10"
ilhook = { version = "2.2.0", features = ["x64"] }

[workspace.dependencies.windows]
version = "0.54"
features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
